version: '3.8'

services:
  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: Tryinterview
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: tryinterview-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: Tryinterview
      MONGO_INITDB_ROOT_PASSWORD: your_secure_password_change_this
      MONGO_INITDB_DATABASE: tryinterview_auth
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  mongodb_data:
  mongodb_config:
